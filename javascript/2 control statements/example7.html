<!-- nested if else statement -->

<script>
    var m1 = 60
    var m2 =2
    var m3 = 89
    var m4 = 90
    var m5 = 98

    var total = (m1+m2+m3+m3+m5)
    var per = total/5;

    document.write("<br>total : " +total);
    document.write("<br>per : " +per);

    if( per>=75 && per <=100)
         document.write("<br>Grade A");
    else{
       if(per>=60 && per<75)
            document.write("<br>Grade B");
        else{
            if(per>=50 && per<60)
                document.write("<br>Grade C");
            else{
                if(per>=33 && per<50)
                    document.write("<br>Grade D");
                else
                    document.write("<br>Fail");
            }
        }
    }

</script>
