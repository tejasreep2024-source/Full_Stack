<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
    <script>
         
        function myFun(){
            alert('button clicked');
        }
    </script>
</head>
<body>
    <button onclick="alert('button clicked once')">click 1</button>
    <button ondblclick="alert('button clicked twice')">click 2</button>
    <button oncontextmenu="alert('button righht clicked')">click  3</button>
     <button onclick="myFun()">Click  function</button>
    <button id="'mybtnn">click </button>
    <script>
        var e = document.getElementById("mybtnn");
        e.addEventListener('click',()=>{
            alert('Button clicked');
        });       
      
    </script>
</body>
</html>
