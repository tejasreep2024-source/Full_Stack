<!-- 
 JavaScript PopUp's : 
    There are three types of JavaScript Popup's : 

        a. alert() (window.alert())
        -Used to show a message to the user.
        -Shows only an OK button.
        
        
        b. confirm() (window.confirm())-Used to ask the user for confirmation.
        Shows OK and Cancel buttons.
             ➡ Returns true (OK) or false (Cancel).
        
        
         c. prompt() (window.prompt())-Used to take input from the user.-Shows a text box with OK and Cancel buttons.
-->

</script>
