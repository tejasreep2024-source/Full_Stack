<script>
    var arr = [1,1,2,3,44,44,56]
    document.write("Array elements are : "+arr);
    arr.map((element,index)=>{
        document.write("<br>arr["+index+"] : "+element);
    })
    
    var arrNew = arr.map((element,index)=>{
        return element;
    })    
    document.write("<br>Array elements are : ",arrNew);

    var arrNew = arr.map((element,index)=>{
        return element%2==0;
    })    
    document.write("<br>Array elements are : ",arrNew);

    var arrNew = arr.map((element,index)=>{
        return element%2==0 ? element : 0;
    })    
    document.write("<br>Array elements are : ",arrNew);

    var arrNew = arr.map((element,index)=>{
        if(element%2==0)
            return element;
    })    
    document.write("<br>Array elements are : ",arrNew);

</script>
