<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="login-box">
        <h2>Login to Dashboard</h2>

        <button class="google">Sign in with Google</button>
        <button class="apple">Sign in with Apple</button>

        <p>or</p>

        <input type="email" placeholder="Enter email address">
        <input type="password" placeholder="Enter password">

        <a href="#">Forgot Password?</a>

        <button class="login">Login</button>
    </div>
    <div class="image">
        <img src="https://res.cloudinary.com/gimmersta-wallpaper/image/upload/c_fill,f_auto,fl_progressive,q_auto,h_720/v1688046599/articles/S10204_interior5.jpg" alt="dashboard image">
    </div>

</div>

</body>
</html>
